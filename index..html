<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NEXUS // LAUNCHPAD</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-void: #050507;
      --bg-surface: #0b0c10;
      --bg-elevated: #11131a;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-strong: rgba(255, 255, 255, 0.16);
      --text-primary: #f4f4f6;
      --text-secondary: #8e92a4;
      --text-muted: #525669;
      --accent: #22d3ee;
      --accent-dim: rgba(34, 211, 238, 0.12);
      --danger: #f43f5e;
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-void);
      color: var(--text-primary);
      font-family: var(--font-sans);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
      -webkit-font-smoothing: antialiased;
    }

    /* Architectural Background Grid & Ambient Cyan Glow */
    .bg-grid {
      position: fixed;
      inset: 0;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 44px 44px;
      mask-image: radial-gradient(ellipse 80% 70% at 50% 0%, #000 40%, transparent 100%);
      -webkit-mask-image: radial-gradient(ellipse 80% 70% at 50% 0%, #000 40%, transparent 100%);
      pointer-events: none;
      z-index: 0;
    }

    .bg-glow {
      position: fixed;
      top: -180px;
      left: 50%;
      transform: translateX(-50%);
      width: 900px;
      height: 420px;
      background: radial-gradient(circle, rgba(34, 211, 238, 0.09) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 24px 80px;
    }

    /* Top Telemetry Bar */
    .telemetry {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border-subtle);
      margin-bottom: 32px;
    }

    .status-dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent);
      margin-right: 8px;
    }

    /* Header & Controls */
    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: flex-end;
      gap: 20px;
      margin-bottom: 32px;
    }

    .title-group h1 {
      font-family: var(--font-mono);
      font-size: clamp(22px, 3vw, 28px);
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--text-primary);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 4px 8px;
      margin-left: -8px;
      border-radius: 6px;
      transition: background 0.2s;
    }

    .title-group h1:hover {
      background: rgba(255, 255, 255, 0.04);
    }

    .title-group h1:focus {
      outline: 1px solid var(--accent);
      background: var(--bg-elevated);
    }

    .title-group p {
      font-size: 13px;
      color: var(--text-secondary);
      margin-top: 4px;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }

    .search-box {
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-box input {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
      font-family: var(--font-mono);
      font-size: 13px;
      padding: 9px 36px 9px 14px;
      border-radius: 8px;
      width: 240px;
      transition: border-color 0.2s, width 0.2s;
    }

    .search-box input:focus {
      outline: none;
      border-color: var(--accent);
      width: 280px;
    }

    .kbd-hint {
      position: absolute;
      right: 10px;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-muted);
      border: 1px solid var(--border-subtle);
      padding: 1px 6px;
      border-radius: 4px;
      pointer-events: none;
    }

    .btn {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 500;
      padding: 9px 14px;
      border-radius: 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.18s ease;
    }

    .btn:hover {
      border-color: var(--border-strong);
      background: var(--bg-elevated);
    }

    .btn-primary {
      background: var(--accent-dim);
      border-color: rgba(34, 211, 238, 0.35);
      color: var(--accent);
    }

    .btn-primary:hover {
      background: rgba(34, 211, 238, 0.2);
      border-color: var(--accent);
    }

    .btn-danger {
      color: var(--danger);
      border-color: rgba(244, 63, 94, 0.3);
    }
